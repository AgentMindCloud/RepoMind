# RepoMind multi-repo config – Phase 7
primary:
  full_name: AgentMindCloud/RepoMind
  role: os
  default_branch: main

secondary: []
  # Example:
  # - full_name: AgentMindCloud/xlOS
  #   role: satellite
  #   allowed_actions: [read, comment]
  #   write_requires_human_approved: true

policy:
  write_targets:
    - proposals/
    - docs/
    - skills/
    - memory/
    - tests/
    - marketplace/
  never_auto_merge: true
  require_human_approved_label: true
  cross_repo_writes: false
  cross_repo_comments: false
  satellite_writes_require_human_approved: true
