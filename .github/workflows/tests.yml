name: RepoMind Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
      - name: Verify pack checksums (advisory)
        run: |
          python -c "
          from marketplace.checksums import load_packs, sha256_file
          import os, json
          data = load_packs()
          packs = data.get('packs') or []
          print(f'Packs loaded: {len(packs)}')
          for p in packs:
              entry = p.get('entry') or 'implementation.py'
              rel = os.path.join(p.get('path', ''), entry)
              actual = sha256_file(rel)
              expected = p.get('checksum_sha256')
              status = 'PINNED' if expected and expected != 'pending-local-compute' else 'ADVISORY'
              print(f\"  {p.get('id')}: {status} path={rel} actual={actual[:12] if actual else None}...\")
              assert actual, f'Missing file for pack {p.get(\"id\")}: {rel}'
          print('Pack path verification OK')
          "
